<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joy Journal</title>
  <meta name="description" content="Record the joyful actions and encounters of each day, by voice or by typing.">
  <meta name="theme-color" content="#e8557a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Joy Journal</h1>
    <p class="tagline">Little moments of joy, one heart at a time.</p>
  </header>

  <main>
    <section class="card" aria-labelledby="new-joy-title">
      <h2 id="new-joy-title">Record a joy</h2>
      <form id="joy-form" autocomplete="off">
        <label for="joy-text" class="sr-only">What brought you joy?</label>
        <div class="input-wrap">
          <textarea id="joy-text" rows="3" maxlength="500"
            placeholder="What brought you joy today? Type it, or tap the mic and say it."></textarea>
          <button type="button" id="mic-btn" class="mic-btn" aria-pressed="false" aria-label="Record by voice" title="Record by voice">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
          </button>
        </div>
        <p id="mic-status" class="mic-status" aria-live="polite"></p>

        <fieldset class="hearts-field">
          <legend>How joyful was it?</legend>
          <div id="heart-picker" class="heart-picker" role="radiogroup" aria-label="Joy score in hearts"></div>
          <span id="heart-label" class="heart-label"></span>
        </fieldset>

        <div class="form-actions">
          <span class="char-count" id="char-count">0 / 500</span>
          <button type="submit" class="btn primary" id="save-btn" disabled>Save joy</button>
        </div>
      </form>
    </section>

    <section class="stats" aria-label="Your joy stats">
      <div class="stat"><span class="stat-num" id="stat-today">0</span><span class="stat-label">joys today</span></div>
      <div class="stat"><span class="stat-num" id="stat-streak">0</span><span class="stat-label">day streak</span></div>
      <div class="stat"><span class="stat-num" id="stat-avg">–</span><span class="stat-label">avg hearts</span></div>
      <div class="stat"><span class="stat-num" id="stat-posted">0</span><span class="stat-label">shared</span></div>
    </section>

    <section class="card" aria-labelledby="history-title">
      <div class="history-head">
        <h2 id="history-title">Your joys</h2>
        <div class="filters" role="group" aria-label="Filter by hearts">
          <button type="button" class="chip active" data-filter="all">All</button>
          <button type="button" class="chip" data-filter="high">4–5 ♥</button>
          <button type="button" class="chip" data-filter="unshared">Ready to share</button>
        </div>
      </div>
      <div id="history"></div>
      <div class="data-actions">
        <button type="button" class="btn ghost small" id="export-btn">Export</button>
        <label class="btn ghost small" for="import-file">Import</label>
        <input type="file" id="import-file" accept="application/json" hidden>
      </div>
    </section>
  </main>

  <!-- Threads confirmation dialog -->
  <dialog id="share-dialog" aria-labelledby="share-title">
    <form method="dialog" class="dialog-body">
      <h2 id="share-title">Share this joy on Threads?</h2>
      <p class="dialog-sub">This moment scored <span id="share-hearts"></span>. You can edit the post before sharing.</p>
      <label for="share-text" class="sr-only">Post text</label>
      <textarea id="share-text" rows="5" maxlength="500"></textarea>
      <p class="char-count" id="share-count"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost">Not now</button>
        <button value="confirm" class="btn threads" id="share-confirm">
          <svg viewBox="0 0 192 192" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M141.5 88.99c-.83-.4-1.67-.78-2.52-1.15-1.49-27.38-16.45-43.05-41.56-43.21h-.34c-15.02 0-27.51 6.41-35.2 18.08l13.81 9.47c5.74-8.71 14.75-10.57 21.4-10.57h.23c8.27.05 14.51 2.46 18.55 7.15 2.94 3.42 4.91 8.14 5.88 14.1-7.33-1.25-15.26-1.63-23.74-1.14-23.88 1.38-39.23 15.3-38.2 34.65.52 9.81 5.41 18.25 13.76 23.77 7.06 4.66 16.16 6.94 25.61 6.42 12.49-.68 22.28-5.45 29.11-14.16 5.19-6.62 8.47-15.19 9.92-25.99 5.95 3.59 10.36 8.31 12.8 13.99 4.14 9.65 4.38 25.5-8.55 38.42-11.33 11.32-24.95 16.21-45.53 16.36-22.83-.17-40.1-7.49-51.32-21.76C35.11 120.04 29.68 100.44 29.48 76c.2-24.44 5.63-44.04 16.13-57.39 11.22-14.27 28.49-21.59 51.32-21.76 23 .17 40.57 7.53 52.23 21.88 5.72 7.04 10.03 15.89 12.87 26.21l16.19-4.32c-3.45-12.7-8.88-23.64-16.27-32.74C147.04 9.6 125.2.2 97.07 0h-.11C68.89.2 47.32 9.64 32.88 28.04 20.03 44.41 13.4 67.19 13.18 75.93v.14c.22 8.74 6.85 31.52 19.7 47.89 14.44 18.4 36.01 27.84 64.08 28.04h.11c24.96-.17 42.55-6.71 57.04-21.19 18.96-18.94 18.39-42.69 12.14-57.27-4.48-10.46-13.03-18.96-24.73-24.55Zm-43.1 40.52c-10.44.59-21.29-4.1-21.82-14.13-.4-7.43 5.29-15.73 22.42-16.72 1.96-.11 3.89-.17 5.78-.17 6.22 0 12.05.6 17.34 1.76-1.97 24.66-13.55 28.68-23.72 29.26Z"/></svg>
          Post to Threads
        </button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
